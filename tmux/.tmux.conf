set -g mode-keys vi
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on
set -g mouse on
set -s set-clipboard on

unbind -T copy-mode-vi Space
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe "wl-copy"
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g aggressive-resize on

# Follow the terminal palette; colour235 is the dark selection background.
set -g status-style 'fg=default,bg=default'
setw -g window-status-style 'fg=brightblack,bg=default'
setw -g window-status-current-style 'fg=default,bg=colour235,bold'
setw -g window-status-activity-style 'fg=brightcyan,bg=default'
setw -g window-status-bell-style 'fg=red,bg=default,bold'

setw -g pane-border-style 'fg=brightblack'
setw -g pane-active-border-style 'fg=blue'
setw -g mode-style 'fg=default,bg=colour235'
set -g message-style 'fg=default,bg=colour235'
set -g message-command-style 'fg=brightcyan,bg=black'

# Session, named windows, and the active program.
set -g status-left '#[fg=brightcyan]#S #[default]│ '
set -g status-left-length 24
set -g status-right '#[fg=brightcyan]#{?client_prefix,PREFIX ,}#[fg=default]#{pane_current_command} '
set -g status-right-length 40

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
