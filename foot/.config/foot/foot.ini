font=monospace:size=16
term=xterm-256color

[bell]
system=no
command=/usr/bin/canberra-gtk-play --id=bell
command-focused=yes

[scrollback]
lines=131072
indicator-format=percentage

[colors-dark]
# Gruvbox Material Dark Medium
# https://gist.github.com/sainnhe/ad5cbc4f05c4ced83f80e54d9a75d22f
# Lift bright black for readable dim text; use fg1 for bright white.
cursor=282828 d4be98
foreground=d4be98
background=282828
# Keep text opaque; only the terminal background is translucent.
alpha=0.94
alpha-mode=default
regular0=3c3836
regular1=ea6962
regular2=a9b665
regular3=d8a657
regular4=7daea3
regular5=d3869b
regular6=89b482
regular7=d4be98
bright0=928374
bright1=ea6962
bright2=a9b665
bright3=d8a657
bright4=7daea3
bright5=d3869b
bright6=89b482
bright7=ddc7a1
selection-foreground=ddc7a1
selection-background=45403d
