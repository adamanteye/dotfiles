font=monospace:size=16
term=xterm-256color

[bell]
system=no
command=/usr/bin/canberra-gtk-play --id=bell
command-focused=yes

[scrollback]
lines=131072
indicator-format=percentage

[colors-dark]
# Midnight-inspired terminal palette, tuned for text readability.
# Six bright chromatic colors use an OKLab lightness increment of 0.08.
cursor=000000 d9d9d9
foreground=d9d9d9
background=000000
alpha=1.0
# ANSI colors tuned for readability on black; fish/tmux reference these slots.
regular0=000000
regular1=f08080
regular2=92b866
regular3=cca45b
regular4=9b8be5
regular5=d787d7
regular6=64b3b3
regular7=d9d9d9
bright0=999999
bright1=ffa2a0
bright2=abd27f
bright3=e6bd74
bright4=b4a4ff
bright5=f2a0f2
bright6=7ecdcd
bright7=ffffff
selection-foreground=d9d9d9
selection-background=262626
jump-labels=000000 7ecdcd
scrollback-indicator=d9d9d9 262626
search-box-match=d9d9d9 000080
urls=64b3b3
